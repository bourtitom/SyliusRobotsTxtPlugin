monsieurbiz_sylius_settings:
    plugins:
        monsieurbiz_robots_txt.robotstxt:
            vendor_name: Monsieur Biz
            plugin_name: monsieurbiz_robots_txt.settings.robots_txt.plugin_name
            description: monsieurbiz_robots_txt.settings.robots_txt.description
            icon: searchengin
            use_locales: false
            classes:
                form: MonsieurBiz\SyliusRobotsTxtPlugin\Form\Type\RobotsTxtType
            default_values:
                robots_txt_content: |
                    User-agent: *
                    Disallow:
        monsieurbiz_robots_txt.llmstxt:
            vendor_name: Monsieur Biz
            plugin_name: monsieurbiz_robots_txt.settings.llms_txt.plugin_name
            description: monsieurbiz_robots_txt.settings.llms_txt.description
            icon: brain
            use_locales: false
            classes:
                form: MonsieurBiz\SyliusRobotsTxtPlugin\Form\Type\LlmsTxtType
            default_values:
                llms_txt_content: |                    
                    User-agent: *
                    Allow: /
                    
                    Crawl-delay: 2
                    Respect-copyright: true
